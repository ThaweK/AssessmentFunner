<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Funner Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/psychomotor.css">
    <link rel="stylesheet" href="styles/technical.css">
    <link rel="stylesheet" href="styles/elp.css">
    <link rel="stylesheet" href="styles/interview.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/analytics.css">
</head>
<body>
    <div class="password-gate" id="passwordGate">
        <div class="password-card">
            <h1>Assessment Funner</h1>
            <p>Enter password to access your training workspace.</p>
            <div class="password-input-group">
                <input type="password" id="passwordInput" placeholder="Password">
                <button id="passwordSubmit" class="btn btn-primary">Enter</button>
            </div>
            <p id="passwordError" class="password-error"></p>
        </div>
    </div>

    <div id="app" class="app-shell" hidden>
        <header class="app-header">
            <div>
                <h1>Assessment Funner</h1>
                <p id="currentDate" class="date-display"></p>
            </div>
            <div class="header-actions">
                <button id="runDailyAll" class="btn btn-primary">Generate Today Across Tabs</button>
            </div>
        </header>

        <nav class="tab-nav" aria-label="Main tabs">
            <button class="tab-btn active" data-tab="psychomotor">Psychomotor</button>
            <button class="tab-btn" data-tab="technical">Technical</button>
            <button class="tab-btn" data-tab="elp">ELP</button>
            <button class="tab-btn" data-tab="interview">Interview</button>
            <button class="tab-btn" data-tab="analytics">Analytics</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </nav>

        <main>
            <section class="tab-panel active" id="tab-psychomotor"></section>
            <section class="tab-panel" id="tab-technical"></section>
            <section class="tab-panel" id="tab-elp"></section>
            <section class="tab-panel" id="tab-interview"></section>
            <section class="tab-panel" id="tab-analytics"></section>
            <section class="tab-panel" id="tab-settings"></section>
        </main>
        <section id="debugPanel" hidden></section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
